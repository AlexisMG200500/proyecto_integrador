services:
  laravel-app:
    build: .
    container_name: laravel-app
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - homelab-net
      - homelab-db-net

networks:
  homelab-net:
    external: true
    name: homelab-net
  homelab-db-net:
    external: true
    name: homelab-db-net
